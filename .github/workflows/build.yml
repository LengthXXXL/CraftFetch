name: Test and build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  content-integration:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: .
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Real content, Java, modpack, Forge and NeoForge integration
        run: python -m tools.content_smoke --forge --pack-install --report artifacts/content-live-Windows.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CraftFetch-content-integration
          path: artifacts/*
          if-no-files-found: warn
  build:
    env:
      PYTHONPATH: .
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-build.txt
      - run: python -m unittest discover -s tests -v
      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb
      - name: GUI smoke test (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a python tests/gui_smoke.py
      - name: GUI smoke test (desktop)
        if: runner.os != 'Linux'
        run: python tests/gui_smoke.py
      - name: Build desktop executable
        run: python -m PyInstaller --clean --noconfirm --onefile --windowed --name CraftFetch --collect-all certifi --collect-data craftfetch run.py
      - name: Package executable and documentation
        shell: python
        run: |
          import hashlib, pathlib, shutil
          stage = pathlib.Path('package/CraftFetch')
          stage.mkdir(parents=True)
          for path in pathlib.Path('dist').iterdir():
              if path.is_file():
                  shutil.copy2(path, stage / path.name)
              else:
                  shutil.copytree(path, stage / path.name)
          for name in ['README.md', 'LICENSE', 'CHANGELOG.md', 'THIRD_PARTY_NOTICES.md']:
              shutil.copy2(name, stage / name)
          output = pathlib.Path('artifacts')
          output.mkdir()
          archive = pathlib.Path(shutil.make_archive(str(output / 'CraftFetch-${{ runner.os }}-${{ runner.arch }}'), 'zip', 'package'))
          digest = hashlib.sha256(archive.read_bytes()).hexdigest()
          (output / (archive.name + '.sha256')).write_text(f'{digest}  {archive.name}\n')
      - name: Build one-click Windows installer
        if: runner.os == 'Windows'
        run: python -m tools.build_installer
      - name: Test one-click install, launch, reinstall and uninstall
        if: runner.os == 'Windows'
        shell: powershell
        run: ./tests/windows_installer.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CraftFetch-${{ runner.os }}-${{ runner.arch }}
          path: artifacts/*
          if-no-files-found: error
