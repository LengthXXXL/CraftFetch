[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "craftfetch"
version = "0.1.1"
description = "Standalone Minecraft Java vanilla downloader for standard launcher directories"
requires-python = ">=3.10"
dependencies = ["certifi>=2024.8.30,<2027"]
license = "MIT"

[project.scripts]
craftfetch = "craftfetch.__main__:main"

[tool.setuptools.packages.find]
include = ["craftfetch*"]
